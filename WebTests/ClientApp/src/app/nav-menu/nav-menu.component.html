<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-500"
        [ngClass]="{
          'bg-white/90 border-b border-gray-100 shadow-sm': isScrolled,
          'bg-white/60 backdrop-blur-md': !isScrolled
        }">
  <nav>
    <div class="container mx-auto px-6 md:px-10 flex items-center justify-between transition-all duration-500"
         [ngClass]="isScrolled ? 'h-12' : 'h-16'">

      <a class="font-black tracking-tighter text-black transition-all duration-500"
         [ngClass]="isScrolled ? 'text-lg' : 'text-xl'"
         [routerLink]="['/']">
        Testify
      </a>

      <div class="hidden md:flex items-center">
        <ul class="flex space-x-6 text-[14px] font-bold text-gray-800">

          <li class="transition-colors hover:text-black"
              [routerLinkActive]="['text-black', 'border-b-2', 'border-black']"
              [routerLinkActiveOptions]="{ exact: true }">
            <a [routerLink]="['/tests']" class="pb-1">Обзор тестов</a>
          </li>

          <li class="transition-colors hover:text-black"
              *ngIf="authService.isAuthenticated"
              [routerLinkActive]="['text-black', 'border-b-2', 'border-black']">
            <a [routerLink]="['/management']" class="pb-1">Управление</a>
          </li>

          <li class="transition-colors hover:text-black"
              *ngIf="authService.isAuthenticated"
              [routerLinkActive]="['text-black', 'border-b-2', 'border-black']">
            <a [routerLink]="['/saved']" class="pb-1">Избранное</a>
          </li>

          <li class="relative" *ngIf="authService.isAuthenticated">

            <button (click)="toggleNotifications()"
                    class="relative flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray-100 transition transition-all duration-200">

              🔔

              <span *ngIf="unreadCount > 0" class="absolute -top-1 -right-1 bg-black text-white text-[10px]
             min-w-[18px] h-[18px] px-1 rounded-full flex items-center justify-center">
                {{ unreadCount }}
              </span>

            </button>

            <div *ngIf="isNotificationsOpen"
                 class="absolute right-0 mt-3 w-80 bg-white border border-gray-200
           rounded-2xl shadow-xl overflow-hidden">

              <div class="p-4 border-b border-gray-100 font-bold">
                Уведомления
              </div>

              <div class="max-h-[400px] overflow-y-auto">

                <button *ngFor="let notification of notifications" (click)="openNotification(notification)" [ngClass]="{'bg-gray-50': !notification.isRead}" class="w-full text-left p-4 hover:bg-gray-50 transition border-b border-gray-100">

                  <div class="text-sm font-semibold">
                    {{ notification.title }}
                  </div>

                  <div class="text-xs text-gray-500 mt-1">
                    {{ notification.message }}
                  </div>

                </button>

              </div>

              <div *ngIf="notifications.length === 0" class="p-6 text-sm text-gray-500 text-center">
                Нет уведомлений
              </div>

            </div>

          </li>

          <li class="transition-colors hover:text-black">
            <div *ngIf="authService.isAuthenticated; else loginLink">
              <a [routerLink]="['/profile', currentUserUsername]"
                 [routerLinkActive]="['text-black']">{{ currentUserUsername }}</a>
            </div>
            <ng-template #loginLink>
              <a [routerLink]="['/login']"
                 [routerLinkActive]="['text-black', 'border-b-2', 'border-black']"
                 class="pb-1">Войти</a>
            </ng-template>
          </li>

        </ul>
      </div>

      <button (click)="toggle()" class="md:hidden p-1 text-gray-800">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

    </div>
  </nav>
</header>
